<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003D71">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Aprendiz SENAI · KSB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icones/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aprendiz">
<style>
/* APRENDIZ SENAI (celular) - KSB Brasil · Usinagem · versão 2.6.19
   Casca do app: abre o sistema do Google Apps Script em tela cheia.
   Abre direto na tela de login do sistema (mesmo padrão do calendário de Férias). Os dados ficam na planilha. */
:root{--azul:#0066B3;--azul-esc:#003D71;--txt:#1B2631;--mut:#6B7C8D;--card:#fff;--topo:env(safe-area-inset-top,0px);--baixo:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F2F5F9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--txt)}
body.app{background:#fff}
#quadro{position:fixed;left:0;right:0;top:var(--topo);bottom:0;width:100%;height:calc(100% - var(--topo));border:0;display:block;background:#fff}
.faixa{position:fixed;left:0;right:0;top:0;height:var(--topo);background:var(--azul-esc);z-index:2}
.oculto{display:none!important}
.entrada{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--topo)) 22px calc(24px + var(--baixo));background:linear-gradient(160deg,#0077C8 0%,#003D71 70%);color:#fff;text-align:center}
.entrada img.ic{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.entrada h1{font-size:22px;margin:14px 0 2px}
.entrada .sub{opacity:.85;font-size:13px;margin-bottom:22px}
.caixa{background:var(--card);color:var(--txt);border-radius:20px;padding:18px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:left;font-size:14px;line-height:1.5}
.caixa p{margin:0 0 10px}
.caixa input{width:100%;font:inherit;border:1.5px solid #E3E8EE;border-radius:12px;padding:11px 12px;margin:4px 0 10px}
.bt{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;background:var(--azul);color:#fff;cursor:pointer;margin-top:6px}
.bt.sec{background:#E8F2FA;color:var(--azul-esc)}
.msg{font-size:13px;color:#C0392B;min-height:18px}
.carregando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(160deg,#0077C8 0%,#003D71 70%);color:#fff;z-index:3;transition:opacity .3s}
.carregando img{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.carregando .gira{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:g 1s linear infinite}
.carregando small{opacity:.85}
@keyframes g{to{transform:rotate(360deg)}}
.instalar{position:fixed;right:12px;bottom:calc(14px + var(--baixo));z-index:5;display:flex;align-items:center;background:#003D71;color:#fff;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;font-weight:600}
.instalar button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:10px 6px 10px 16px}
.instalar #bt-fechar-inst{padding:10px 14px 10px 8px;opacity:.75}
.rodape{margin-top:18px;font-size:11px;opacity:.7}
</style>
</head>
<body>
<div class="faixa oculto" id="faixa"></div>

<!-- Sem internet -->
<section class="entrada oculto" id="tela-off">
  <img class="ic" src="icones/icone-192.png" alt="">
  <h1>Sem internet</h1>
  <div class="sub">O sistema precisa de internet para abrir.</div>
  <div class="caixa">
    <p>Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button class="bt" id="bt-tentar">Tentar de novo</button>
  </div>
</section>

<!-- Instalar: botão discreto, só quando o navegador oferece (Android e PC) -->
<div class="instalar oculto" id="instalar"><button id="bt-instalar">⬇ Instalar o app</button><button id="bt-fechar-inst" aria-label="Fechar">✕</button></div>

<div class="carregando oculto" id="carregando">
  <img src="icones/icone-192.png" alt="">
  <div class="gira"></div>
  <small>Abrindo o sistema…</small>
</div>

<iframe id="quadro" class="oculto" title="Aprendiz SENAI" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>

<script>
(function () {
  'use strict';
  // Endereço do sistema (Apps Script), colocado pelo npm run celular a partir de celular/link.txt.
  var APP = 'https://script.google.com/macros/s/AKfycbw_VCDGv1fICSyH0OHirWESnU3OKcOJKdVHyl1r2b8eU5PZjQPEyyhybnazcIq3UEEz/exec';
  var $ = function (id) { return document.getElementById(id); };
  var mostrar = function () {
    ['tela-off', 'carregando', 'quadro', 'faixa'].forEach(function (x) { $(x).classList.add('oculto'); });
    [].slice.call(arguments).forEach(function (x) { $(x).classList.remove('oculto'); });
  };

  function abrir() {
    if (!navigator.onLine) { mostrar('tela-off'); return; }
    mostrar('carregando');
    var q = $('quadro');
    q.onload = function () { mostrar('quadro', 'faixa'); };
    q.src = APP + '?app=celular';
    // Se o Google demorar, mostra assim mesmo.
    setTimeout(function () { if (!$('carregando').classList.contains('oculto')) mostrar('quadro', 'faixa'); }, 12000);
  }

  // Instalar: o Chrome e o Edge (Android e PC) avisam quando dá para instalar; aparece um botão discreto.
  // No iPhone: Compartilhar > Adicionar à Tela de Início.
  var pedido = null;
  var dispensou = false; try { dispensou = sessionStorage.getItem('aprendiz-inst-fechado') === '1'; } catch (e) {}
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); pedido = e;
    if (!dispensou) $('instalar').classList.remove('oculto');
  });
  window.addEventListener('appinstalled', function () { $('instalar').classList.add('oculto'); });
  $('bt-instalar').onclick = function () {
    if (!pedido) return;
    pedido.prompt();
    pedido.userChoice.then(function () { pedido = null; $('instalar').classList.add('oculto'); });
  };
  $('bt-fechar-inst').onclick = function () {
    $('instalar').classList.add('oculto');
    try { sessionStorage.setItem('aprendiz-inst-fechado', '1'); } catch (e) {}
  };

  // O sistema pede para trocar a página (login, sair, voltar ao login). Só aceita endereços do próprio sistema.
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.tipo !== 'aprendiz-ir' || typeof d.url !== 'string') return;
    // O Google pode devolver o endereço escrito de outro jeito (/a/macros/dominio/..., outro id da mesma implantação).
    // Aceita qualquer /exec do script.google.com, mas sempre abre o endereço oficial (APP) com os mesmos parâmetros.
    var partes = d.url.split('?');
    if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(partes[0]) && partes[0] !== APP) return;
    var q = (partes[1] || '').replace(/(^|&)app=celular(&|$)/, '$1').replace(/&$/, '');
    var url = APP + '?' + (q ? q + '&' : '') + 'app=celular';
    mostrar('carregando');
    $('quadro').src = url;
  });

  $('bt-tentar').onclick = abrir;
  window.addEventListener('online', function () { if (!$('tela-off').classList.contains('oculto')) abrir(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  abrir();
})();
</script>
</body>
</html>
